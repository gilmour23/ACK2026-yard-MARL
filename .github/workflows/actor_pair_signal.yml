name: actor-pair-signal-diagnostic

on:
  push:
    branches:
      - experiment/critic-diagnostic
    paths:
      - '.github/workflows/actor_pair_signal.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: [control_value2, treatment_value20]
        seed: [21, 22, 23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify checkpoint SHA
        run: echo "2bbd3a2e795a215d3fcbd654d58fad154d4298b55bb50ce92f54ad50b82ddb59  diagnostic_inputs/groupnorm_12k_resource_marl_final.pt" | sha256sum -c -
      - name: Run actor pair-signal diagnostic
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          ARM: ${{ matrix.arm }}
          SEED: ${{ matrix.seed }}
        run: |
          EXTRA=0
          if [ "$ARM" = "treatment_value20" ]; then EXTRA=18; fi
          python scripts/actor_pair_signal_diagnostic.py \
            --checkpoint diagnostic_inputs/groupnorm_12k_resource_marl_final.pt \
            --out actor_pair_signal/$ARM/seed$SEED \
            --seed $SEED \
            --critic-extra-epochs $EXTRA
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-pair-signal-${{ matrix.arm }}-seed${{ matrix.seed }}
          path: actor_pair_signal
          if-no-files-found: warn
          retention-days: 30
