name: rule-resolved-confirmation

on:
  push:
    branches:
      - experiment/critic-diagnostic
    paths:
      - '.github/workflows/rule_resolved_confirmation.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: [control_flat, treatment_rule]
        seed: [31, 32, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify checkpoint SHA
        run: echo "2bbd3a2e795a215d3fcbd654d58fad154d4298b55bb50ce92f54ad50b82ddb59  diagnostic_inputs/groupnorm_12k_resource_marl_final.pt" | sha256sum -c -
      - name: Run bounded confirmation
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          ARM: ${{ matrix.arm }}
          SEED: ${{ matrix.seed }}
        run: |
          python scripts/run_rule_resolved_confirmation.py \
            --checkpoint diagnostic_inputs/groupnorm_12k_resource_marl_final.pt \
            --out rule_resolved_confirmation/$ARM/seed$SEED \
            --arm $ARM \
            --seed $SEED
      - name: Upload confirmation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-confirm-${{ matrix.arm }}-seed${{ matrix.seed }}
          path: rule_resolved_confirmation
          if-no-files-found: warn
          retention-days: 30
