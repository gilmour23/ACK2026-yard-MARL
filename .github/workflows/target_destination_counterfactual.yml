name: target-destination-counterfactual

on:
  push:
    branches:
      - experiment/critic-diagnostic
    paths:
      - '.github/workflows/target_destination_counterfactual.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [51, 52, 53]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download frozen final Proposed checkpoint
        uses: actions/download-artifact@v4
        with:
          name: final-train-proposed_marl-seed${{ matrix.seed }}
          path: source
          github-token: ${{ github.token }}
          run-id: 35951014861
      - name: Verify checkpoint exists
        run: test -f source/train/resource_marl_final.pt
      - name: Run no-training decomposition
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/target_destination_counterfactual.py \
            --checkpoint source/train/resource_marl_final.pt \
            --training-seed ${{ matrix.seed }} \
            --scenarios 1101 1102 1103 1104 1105 1106 1107 1108 1109 1110 \
            --min-targets 3 \
            --destination-top-k 5 \
            --out tdcf/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: tdcf-seed${{ matrix.seed }}
          path: tdcf/seed${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: diagnose
    if: ${{ needs.diagnose.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: tdcf-seed*
          path: collected
          merge-multiple: false
      - name: Aggregate decomposition
        env:
          PYTHONPATH: src:scripts
        run: |
          python scripts/summarize_target_destination_counterfactual.py \
            --root collected \
            --out tdcf_summary
      - uses: actions/upload-artifact@v4
        with:
          name: target-destination-counterfactual-summary
          path: tdcf_summary
          if-no-files-found: error
          retention-days: 90
