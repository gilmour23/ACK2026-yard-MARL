name: v5-branch-credit-selfhosted-recovery

on:
  push:
    branches:
      - experiment/critic-diagnostic
    paths:
      - '.github/workflows/v5_branch_credit_selfhosted_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover_and_fit:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download frozen V5 seed63 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v5-pilot-treatment_v5-seed63
          path: source
          github-token: ${{ github.token }}
          run-id: 35989214777

      - name: Download completed seed61 dataset
        uses: actions/download-artifact@v4
        with:
          name: v5-branch-credit-seed61
          path: collected/seed61
          github-token: ${{ github.token }}
          run-id: 35994074454

      - name: Download completed seed62 dataset
        uses: actions/download-artifact@v4
        with:
          name: v5-branch-credit-seed62
          path: collected/seed62
          github-token: ${{ github.token }}
          run-id: 35994074454

      - name: Collect seed63 scenarios locally in parallel
        env:
          PYTHONPATH: src:.
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >
          python scripts/run_v5_branch_credit_seed63_selfhosted.py
          --checkpoint source
          --out-root collected
          --max-workers 3

      - name: Fit pre-registered grouped-CV offline critics
        env:
          PYTHONPATH: src:.
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >
          python scripts/fit_v5_branch_credit_offline.py
          --root collected
          --out branch_credit_summary

      - name: Print final diagnostic summary
        run: python -c "from pathlib import Path; print(Path('branch_credit_summary/SUMMARY.md').read_text(encoding='utf-8'))"

      - name: Upload diagnostic summary
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v5-branch-credit-selfhosted-summary
          path: |
            branch_credit_summary
            collected/seed63_local_parallel_manifest.json
          if-no-files-found: error
          retention-days: 90
