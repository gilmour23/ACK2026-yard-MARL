name: v5-hierarchical-preflight

on:
  push:
    branches:
      - experiment/critic-diagnostic
    paths:
      - 'v5/**'
      - 'tests/test_v5_hierarchical_yc.py'
      - 'tests/test_v5_hierarchical_trainer.py'
      - 'audits/V5_HIERARCHICAL_ARCHITECTURE_SPEC_20260924.md'
      - '.github/workflows/v5_hierarchical_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Syntax check V5
        run: python -m py_compile v5/__init__.py v5/hierarchical_yc.py v5/train_hierarchical_marl.py v5/evaluate_hierarchical.py
      - name: V5 tests
        env:
          PYTHONPATH: src:.
        run: pytest -q tests/test_v5_hierarchical_yc.py tests/test_v5_hierarchical_trainer.py
      - name: Tiny hierarchical trainer smoke
        env:
          PYTHONPATH: src:.
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from v5.train_hierarchical_marl import HierarchicalPPOConfig, train_hierarchical_marl
          cfg=HierarchicalPPOConfig(
              total_steps=1,
              rollout_steps=1,
              min_storage_transitions=0,
              min_yc_transitions=0,
              max_rollout_multiplier=1,
              update_epochs=1,
              critic_extra_epochs=1,
              minibatch_size=4096,
              hidden=32,
              candidate_hidden=8,
              seed=999,
          )
          _,updates=train_hierarchical_marl(cfg,Path('/tmp/v5_smoke'))
          assert updates
          assert updates[-1]['rollout_ended_at_terminal'] is True
          assert updates[-1]['critic_extra_actor_max_abs_delta'] == 0.0
          print({
              'global_step':updates[-1]['global_step'],
              'yc_targets':updates[-1]['yc_feasible_targets'],
              'yc_pairs':updates[-1]['yc_feasible_pairs'],
          })
          PY
